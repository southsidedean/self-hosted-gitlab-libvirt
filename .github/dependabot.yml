# Keeps the actions in .github/workflows, which are pinned to exact commits, up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all of them, and only for releases at least a week old.
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
