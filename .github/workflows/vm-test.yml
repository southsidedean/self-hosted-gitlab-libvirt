name: vm-test

# Not a required check. It boots a real VM, so it's slower than the checks in tests.yml.
on:
  pull_request:
    paths:
      - .github/workflows/vm-test.yml
      - scripts/vm-test.sh
      - runner-builder.sh
      - install-libvirt-driver.sh
      - opt/libvirt-driver/**
  # Weekly, so a change in Debian, Ubuntu, or the package repositories shows up.
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's documented way to turn on KVM for a hosted Linux runner.
      - name: Turn on KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Ubuntu's mirror can be very slow, so packages are kept from run to run, and the install
      # skips recommended packages. They're saved even if a later step fails.
      - name: This week, for the cache's name
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Packages from earlier runs
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: vm-test-debs-${{ steps.week.outputs.week }}
          restore-keys: vm-test-debs-
      - name: Install libvirt and the VM tools
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=3 -o Dir::Cache::Archives="$HOME/apt-cache" \
            qemu-system-x86 qemu-utils ipxe-qemu libvirt-daemon-system libvirt-clients virtinst guestfs-tools dnsmasq-base osinfo-db passt
          sudo chown -R "$(id -u)" ~/apt-cache
      - name: Save the packages for later runs
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-cache
          key: vm-test-debs-${{ steps.week.outputs.week }}
      - name: TEMPORARY network diagnostic
        run: |
          echo "--- host"; ls -l /etc/resolv.conf; cat /etc/resolv.conf; resolvectl dns || true; which passt; dpkg -l passt | tail -1; dpkg -l libguestfs0t64 libguestfs0 2>/dev/null | tail -2
          probe='{ ls -l /etc/resolv.conf; cat /etc/resolv.conf; ip addr; ip route; getent hosts deb.debian.org || echo "DNS FAILED"; timeout 5 bash -c "</dev/tcp/1.1.1.1/53" && echo "TCP BY IP OK" || echo "TCP BY IP FAILED"; timeout 5 bash -c "</dev/tcp/151.101.2.132/80" && echo "HTTP BY IP OK" || echo "HTTP BY IP FAILED"; } > /root/diag.txt 2>&1 || true'
          sudo LIBGUESTFS_BACKEND=direct virt-builder debian-13 --size 8G --output /tmp/d1.qcow2 --format qcow2 --root-password disabled --network --run-command "$probe" -v -x > /tmp/vb.log 2>&1 || true
          echo "--- qemu network args"; grep -E 'netdev|passt|slirp|-nic ' /tmp/vb.log | cut -c1-200 | head -12
          echo "--- inside the build, default host resolv.conf"; sudo virt-cat -a /tmp/d1.qcow2 /root/diag.txt
          echo "--- again, with the host's real resolv.conf"
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf; cat /etc/resolv.conf
          sudo LIBGUESTFS_BACKEND=direct virt-builder debian-13 --size 8G --output /tmp/d2.qcow2 --format qcow2 --root-password disabled --network --run-command "$probe" > /tmp/vb2.log 2>&1 || true
          sudo virt-cat -a /tmp/d2.qcow2 /root/diag.txt
          exit 1
      - name: Build the image and run jobs in a VM
        run: sudo scripts/vm-test.sh
