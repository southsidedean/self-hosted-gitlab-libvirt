name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new tool version that finds a problem shows up even in a quiet week.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Each push to main gets a run
# of its own, so none is skipped when merges come close together.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one required check. New checks go in scripts/check.sh, so the ruleset never changes.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck and pipx come with the runner. actionlint is pinned to a release, and
      # checked against that release's published checksum.
      - name: Install actionlint
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install zizmor
        run: pipx install zizmor==1.32.0
      - name: Run the checks
        run: scripts/check.sh
